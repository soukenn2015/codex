<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>MarketLens</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=202606241730">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">MarketLens</h1>
    <span class="app-updated" id="lastUpdated"></span>
  </header>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="overview">俯瞰</button>
    <button class="tab-btn" data-tab="products">商品</button>
  </nav>

  <main class="app-main" id="appMain">
    <section class="tab-content active" id="overviewTab">
      <div class="overview-report" id="overviewReport">
        <p class="overview-loading">読み込み中...</p>
      </div>
    </section>

    <section class="tab-content" id="productsTab">
      <div class="products-toolbar">
        <nav class="display-mode-tabs" id="displayModeTabs" aria-label="表示モード">
          <button class="mode-btn" data-mode="strict" type="button">厳選</button>
          <button class="mode-btn active" data-mode="all" type="button">全候補</button>
        </nav>
        <input
          type="search"
          class="product-search"
          id="productSearch"
          placeholder="商品名で検索..."
          autocomplete="off"
          enterkeyhint="search"
        >
      </div>
      <p class="products-summary" id="productsSummary"></p>
      <nav class="category-tabs" id="categoryTabs">
        <button class="cat-btn active" data-cat="all">全体</button>
        <button class="cat-btn" data-cat="pokeca">ポケカ</button>
        <button class="cat-btn" data-cat="onepiece">ワンピカ</button>
        <button class="cat-btn" data-cat="kuji">くじ</button>
        <button class="cat-btn" data-cat="figure">フィギュア</button>
        <button class="cat-btn" data-cat="limited">限定品</button>
        <button class="cat-btn" data-cat="other">その他</button>
      </nav>
      <div class="product-sections" id="productSections"></div>
    </section>
  </main>

  <button class="chat-fab" id="chatFab" aria-label="AIに聞く">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <div class="chat-overlay hidden" id="chatOverlay">
    <div class="chat-sheet">
      <div class="chat-header">
        <span class="chat-title">AIに聞く</span>
        <button class="chat-close" id="chatClose">&times;</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="質問を入力...">
        <button class="chat-send" id="chatSend">送信</button>
      </div>
      <div class="chat-key-setup hidden" id="chatKeySetup">
        <p class="key-setup-text">AIチャットを使うにはGemini APIキーが必要です。</p>
        <input type="password" class="key-setup-input" id="keyInput" placeholder="Gemini APIキーを入力">
        <button class="key-setup-save" id="keySave">保存</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=202606241730"></script>
</body>
</html>
