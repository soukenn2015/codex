name: Market Mapper Weekly

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run market mapper
        run: node scripts/market-mapper.mjs
      - name: Persist registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly market mapper [skip ci]"
            git push
          fi
