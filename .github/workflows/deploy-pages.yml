name: Deploy MarketLens to GitHub Pages

on:
  workflow_run:
    workflows: ["MarketLens Cycle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (manual fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Download artifact from cycle
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: marketlens-public
          path: public
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build public artifact (manual fallback)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf public
          mkdir -p public/data
          cp index.html styles.css script.js manifest.json icon-192.png icon-512.png public/
          cp data/marketlens.ui-snapshot.json public/data/marketlens.ui-snapshot.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
