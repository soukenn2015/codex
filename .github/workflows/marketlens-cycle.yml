name: MarketLens Cycle

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: marketlens-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci || npm install
      - name: Generate seeds
        run: |
          node scripts/generate-buzz-queries.mjs --write
          node scripts/generate-x-accounts.mjs --write
          node scripts/expand-source-seeds.mjs --write
          node scripts/import-x-accounts.mjs
      - name: Run full cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKETLENS_BUZZ_QUERY_LIMIT: "100"
          MARKETLENS_SKIP_DISCOVERY_AGENT: "1"
        run: npm run marketlens:cycle
      - name: Run checks
        run: npm test
      - name: Persist data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marketlens.snapshot.json data/marketlens.history.json data/marketlens.public-history.json data/buzz-queries.json data/x-accounts.json data/source-config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: MarketLens cycle refresh [skip ci]"
            git push
          fi
      - name: Build public artifact
        run: |
          rm -rf public
          mkdir -p public/data
          cp index.html styles.css script.js manifest.json icon-192.png icon-512.png public/
          cp data/marketlens.ui-snapshot.json public/data/marketlens.ui-snapshot.json
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketlens-public
          path: public/
          retention-days: 2
